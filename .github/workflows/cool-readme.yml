# README cards, see https://github.com/pedrocatalao/github-cool-readme
name: Update README cards

on:
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours
  push:
    branches: [main]
    paths:
      - 'cool-readme.yml'
      - '.github/workflows/cool-readme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check CARDS_TOKEN
        id: token_check
        env:
          HAS_TOKEN: ${{ secrets.CARDS_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "CARDS_TOKEN secret is not set yet. Add a classic PAT (repo, read:org, read:user) as CARDS_TOKEN to generate cards."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token_check.outputs.run == 'true'

      - uses: pedrocatalao/github-cool-readme@v1
        if: steps.token_check.outputs.run == 'true'
        with:
          token: ${{ secrets.CARDS_TOKEN }}
          output: ${{ runner.temp }}/cards

      # The cards live on their own branch, as a single commit replaced on each change, so they
      # don't add to the history of your main branch.
      - name: Publish the cards on the cards branch
        if: steps.token_check.outputs.run == 'true'
        run: |
          if ! ls "$RUNNER_TEMP"/cards/*.svg >/dev/null 2>&1; then echo "No cards: they're off"; exit 0; fi
          git fetch --quiet --depth 1 origin cards:refs/remotes/origin/cards 2>/dev/null || true
          git switch --quiet --orphan cards
          cp "$RUNNER_TEMP"/cards/*.svg .
          git add -- *.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m 'Update README cards'
          if git rev-parse --quiet --verify origin/cards >/dev/null && git diff --quiet origin/cards HEAD; then
            echo "No changes"
            exit 0
          fi
          git push --force origin cards
